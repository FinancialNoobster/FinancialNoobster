name: Update GitHub profile graphics

on:
  workflow_dispatch:
  schedule:
    - cron: '31 3 * * *' # Refresh every day at 03:31 UTC

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate GitHub SVG cards from real public data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: FinancialNoobster
        run: python scripts/build_github_cards.py

      - name: Commit updated graphics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stats.svg assets/top-languages.svg assets/milestones.svg assets/contribution-graph.svg
          if git diff --cached --quiet; then
            echo 'Profile graphics are already current.'
          else
            git commit -m 'chore: refresh public GitHub profile graphics'
            git push
          fi

